mqtt:
  enabled: true
  host: "192.168.1.2"
  port: 1883
  keepalive_sec: 30
  client_id: "dmq_dog"
  # Keep the physical-controller output identical to the proven Agibot driver.
  qos: 0
  control_topic: "robot/local_planning/ctrl"
  odom_topic: "robot/dog/odom"
  dog_status_topic: "robot/dog/status"
  task_topic: "robot/global_planning/info"
  pause_topic: "robot/local_planning/pause_resume"
  obstacle_topic: "robot/obstacle/info"
  status_topic: "robot/local_planning/ctrl"
  voice_topic: "robot/voice/play"
  max_queue_size: 32

topics:
  cmd_vel: "/cmd_vel"
  ros_odom: "/Odometry"
  lidar_scan: "/scan"
  lidar_cloud: "/rslidar_points"
  mqtt_odom_ros: "/dmq_dog/odom"
  # Stable internal outputs consumed by bringup_real.launch.
  navigation_odom: "/dmq_dog/navigation_odom"
  navigation_cloud: "/dmq_dog/navigation_cloud"
  lidar_pose: "/dmq_dog/lidar_pose"
  nav_state: "/navdog/state"
  nav_mode: "/navdog/navigation_mode"
  protocol_status: "/navdog/protocol_status"
  protocol_error: "/navdog/protocol_error"

publish_rate_hz: 10.0
cmd_vel_timeout_sec: 0.30
odom_timeout_sec: 0.50
lidar_timeout_sec: 0.50
use_watchdog_error: true

# var 223d50f474e55a01b03a173a25b2a459d8e3fa2a (上个版本的提交值)
# Navigation runtime. MQTT status publishing is disabled here because the
# dmq_bridge publishes the complete error/status/velocity payload.
control_rate_hz: 50.0
status_rate_hz: 10.0
publish_mqtt_status: false
odom_topic: "/dmq_dog/navigation_odom"
odom_twist_in_world_frame: true
final_cmd_topic: "/navdog/route_cmd"
final_cmd_feedback_topic: "/navdog/final_cmd_feedback"
external_stop_topic: "/navdog/external_stop"
max_vx_limit_topic: "/navdog/max_vx_limit"
protocol_status_topic: "/navdog/protocol_status"
protocol_error_topic: "/navdog/protocol_error"
default_route_z: 0.30
default_max_vx: 0.40

dynamic_obstacle:
  enabled: true
  stop_distance_m: 1.0
  hold_sec: 5.0
  timeout_sec: 1.0

turn_voice:
  enabled: true
  min_yaw_rate: 0.25
  max_linear_speed: 0.20
  cooldown_sec: 5.0
  message: "正在转弯请注意"

limits:
  max_vx: 0.70
  max_vy: 0.12
  max_yaw_rate: 0.65
  max_accel_x: 0.50
  max_accel_y: 0.25
  max_accel_yaw: 0.80

speed_limits:
  # ROUTE_FOLLOW 的模式最高速度。
  # 实际速度还受 MQTT task max_vx 控制。
  route_follow_linear_mps: 0.70

  # 普通 LOCAL_AVOID 的速度上限。
  # 楼梯模式使用 stair_up/linear_speed_mps。
  # 两者都不受 MQTT task max_vx 影响。
  local_avoid_linear_mps: 0.30

# Hard limits applied immediately before publishing to the physical dog.
driver_limits:
  max_vx: 3.0
  max_vy: 1.0
  max_yaw_rate: 3.0

# Values used by the proven agibot_1.1.6.0 physical-dog publisher.
driver_deadband:
  enabled: true
  zero_threshold_vx: 0.03
  zero_threshold_vy: 0.05
  zero_threshold_yaw_rate: 0.015
  min_effective_vx: 0.06
  min_effective_vy: 0.12
  min_effective_yaw_rate: 0.03

# The planners are holonomic, but a guide dog should face its travel path.
# Convert lateral velocity into steering; use turn-in-place for large angles.
driver_motion:
  prefer_forward_motion: true
  lateral_to_yaw_gain: 1.2
  max_yaw_rate: 0.65
  lateral_filter_alpha: 0.20
  max_yaw_accel: 0.80
  max_yaw_decel: 1.20
  turn_only_enter_angle_deg: 35.0
  turn_only_exit_angle_deg: 20.0

frames:
  odom: "odom"
  base: "base_link"
  lidar: "lidar"

dog:
  length: 0.60
  width: 0.30
  height: 0.30

lidar:
  # Body frame: x forward, y left, z up.
  # Default: front at +0.30 m, lidar 10 cm behind it.
  xyz:
    x: 0.20
    y: 0.0
    z: 0.30
  rpy:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

grid_map:
  need_extrinsic: false
  sensor_type: "lidar"
  cloud_is_world: false
  resolution: 0.05
  sliding_map_size_x: 10.0
  sliding_map_size_y: 10.0
  sliding_map_size_z: 5.0
  map_sliding_thresh: 0.2
  body_height: 0.30
  double_cylinder_radius: 0.30
  double_cylinder_offset: 0.18
  # Remove lidar returns from the physical body only. Inflation outside the
  # body remains untouched, so nearby real obstacles are still preserved.
  self_filter_enabled: true
  self_filter_margin_xy: 0.02
  self_filter_margin_z: 0.02
  obstacles_inflation_z_up: 0.10
  obstacles_inflation_z_down: 0.40
  # During an approved ascending route, occupancy up to this height above the
  # interpolated route is treated as stair support. Taller obstacles still block.
  stair_support_clearance_m: 0.25
  p_hit: 0.85
  p_miss: 0.30
  p_min: 0.12
  p_max: 0.98
  p_occ: 0.80
  max_ray_length: 5.0
  # Dense real scans previously took 80-170ms on a 50ms timer and starved
  # SCAN reset/path/takeover callbacks. Fuse at 10Hz and keep only fresh data.
  occupancy_update_interval_sec: 0.10
  # Full occupancy visualization scans the entire voxel map; 5Hz is enough
  # for diagnostics without competing with planning control callbacks.
  visualization_update_interval_sec: 0.20
  # Maximum complete endpoint-and-free-space ray updates per lidar frame.
  max_raycast_walk_points: 8000
  vis_height: 0.30

optimization:
  # Bound one B-spline solve so the single-threaded SCAN ROS callback queue
  # can continue processing reset, path and takeover messages.
  max_wall_time_sec: 0.60

route_corridor:
  lookahead_distance_m: 2.5
  half_width_m: 0.60

navigation_mode:
  enter_blocked_distance_m: 2.0
  # Avoid handing a newly started task to SCAN on one or two noisy corridor
  # samples. Obstacles inside immediate_enter_distance_m still switch at once.
  enter_confirm_sec: 0.15
  immediate_enter_distance_m: 0.45
  min_local_avoid_hold_sec: 1.0
  exit_clear_confirm_sec: 0.50
  exit_front_clearance_m: 2.50
  exit_left_clearance_m: 0.60
  exit_right_clearance_m: 0.60

stair_up:
  enabled: true
  linear_speed_mps: 0.40
  # Keep elevation detection ahead of the 2.0m ordinary-block entry range so
  # the route prior wins before the first stair riser is classified as a wall.
  lookahead_distance_m: 2.20
  trigger_rise_m: 0.20
  min_consecutive_rising_points: 4
  min_average_slope: 0.25
  flat_tolerance_m: 0.03
  baseline_lookback_distance_m: 1.00
  baseline_drop_tolerance_m: 0.06
  max_robot_route_z_error_m: 0.12
  exit_progress_margin_m: 0.15
  exit_confirm_sec: 0.50

scan_recovery:
  takeover_timeout_sec: 1.50
  max_attempts: 2

route_follower:
  lookahead_distance_m: 0.60
  max_lookahead_distance_m: 1.20
  lookahead_time_sec: 1.20
  kp_x: 0.80
  kp_yaw: 1.20

route_corridor_observation:
  map_timeout_sec: 1.50
  max_progress_lag_m: 0.50

safety:
  slow_down_front: 1.50
  emergency_stop: 0.45
  odom_timeout_sec: 0.50
  obstacle_timeout_sec: 1.50
  planner_cmd_timeout_sec: 0.30
  future_tolerance_sec: 0.05

start_align:
  enter_deg: 15.0
  exit_deg: 5.0
  max_hold_sec: 8.0
  kp_yaw: 1.50
  max_yaw_rate: 0.65
  target_min_dist_m: 0.20

goal_controller:
  near_goal_switch_dist: 0.90
  near_goal_kp_v: 0.35
  near_goal_min_v: 0.12
  near_goal_max_v: 0.30
  near_goal_turn_only_deg: 20.0
  near_goal_kp_w: 1.20
  near_goal_max_w: 0.65
  obstacle_finish_timeout_sec: 6.0
  finish_dist: 0.20
  goal_align_reacquire_dist: 0.30
  goal_align_timeout_sec: 3.0
  # Must remain above driver_deadband.zero_threshold_yaw_rate.
  goal_align_min_yaw_rate: 0.03
  finish_yaw_tolerance_deg: 10.0
